<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnata Imperium | Terminal Admin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #020404;
            --glass-bg: rgba(12, 13, 16, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --acid-green: #ccff00;
            --acid-glow: 0 0 15px rgba(204, 255, 0, 0.3);
            --red-alert: #ff2a2a;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --font-display: 'Syncopate', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
        
        body { 
            background-color: var(--bg-deep); 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(204, 255, 0, 0.04), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.02), transparent 25%),
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main); 
            display: flex; 
            min-height: 100vh; 
            overflow: hidden; 
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* SIDEBAR */
        .sidebar { 
            width: 260px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            border-right: 1px solid var(--glass-border); padding: 40px 20px; z-index: 10;
        }
        .logo { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 50px; }
        .logo span { color: var(--acid-green); text-shadow: var(--acid-glow); }
        
        .nav-menu { display: flex; flex-direction: column; gap: 10px; }
        .nav-btn { 
            background: transparent; border: 1px solid transparent; color: var(--text-muted); 
            padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; 
            text-align: left; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 10px;
        }
        .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.02); }
        .nav-btn.active { 
            color: var(--acid-green); border-left: 3px solid var(--acid-green);
            background: linear-gradient(90deg, rgba(204,255,0,0.1) 0%, transparent 100%);
        }

        /* MAIN */
        .main-content { flex: 1; padding: 40px 5%; height: 100vh; overflow-y: auto; position: relative; }
        .view-section { display: none; animation: fadeIn 0.4s ease-out; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-family: var(--font-display); font-size: 1.1rem; color: var(--text-muted); letter-spacing: 2px; }
        
        .btn-danger-glass {
            background: rgba(255, 42, 42, 0.05); border: 1px solid rgba(255, 42, 42, 0.3); color: var(--red-alert);
            padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s;
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-danger-glass:hover { background: rgba(255, 42, 42, 0.2); box-shadow: 0 0 15px rgba(255, 42, 42, 0.3); color: #fff; }

        .btn-edit-glass {
            background: rgba(204, 255, 0, 0.05); border: 1px solid rgba(204, 255, 0, 0.3); color: var(--acid-green);
            padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s;
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-edit-glass:hover { background: rgba(204, 255, 0, 0.2); box-shadow: var(--acid-glow); color: #fff; }

        /* PROFIT TERMINAL */
        .profit-terminal { 
            background: var(--glass-bg); border: 1px solid rgba(204, 255, 0, 0.2); 
            padding: 30px; border-radius: 16px; margin-bottom: 40px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 20px rgba(204,255,0,0.02);
            max-width: 500px; position: relative; overflow: hidden;
            border-left: 4px solid var(--acid-green);
        }
        .profit-terminal::after {
            content: ''; position: absolute; bottom: 15px; right: 20px; width: 150px; height: 15px;
            background: repeating-linear-gradient(90deg, var(--acid-green) 0, var(--acid-green) 3px, transparent 3px, transparent 6px);
            opacity: 0.2;
        }
        .profit-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .profit-value { font-size: 3.2rem; font-family: var(--font-display); color: var(--acid-green); text-shadow: var(--acid-glow); line-height: 1; margin-bottom: 10px; }

        /* TABS */
        .admin-tabs { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid var(--glass-border); padding-bottom: 2px; overflow-x: auto; }
        .tab-btn { 
            background: transparent; border: none; color: var(--text-muted); 
            padding: 10px 0; cursor: pointer; transition: 0.3s; font-size: 0.85rem; font-weight: 600; text-transform: uppercase;
            position: relative; white-space: nowrap;
        }
        .tab-btn::after {
            content: ''; position: absolute; bottom: -3px; left: 0; width: 100%; height: 2px;
            background: var(--acid-green); transform: scaleX(0); transition: 0.3s; box-shadow: var(--acid-glow);
        }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { color: #fff; }
        .tab-btn.active::after { transform: scaleX(1); }

        /* ORDER CARDS TERMINAL */
        .order-list { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .order-card { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; 
            padding: 25px; display: flex; flex-direction: column; gap: 20px; backdrop-filter: blur(10px);
            transition: 0.3s;
        }
        .order-card.rejeitado { opacity: 0.4; filter: grayscale(1); border-color: rgba(255,0,0,0.2); }

        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 15px; }
        .order-id { font-family: var(--font-display); font-size: 0.9rem; color: #fff; display: flex; align-items: center; gap: 10px; }
        .order-id span { color: var(--acid-green); }
        
        .status-badge { font-size: 0.65rem; font-weight: 700; padding: 6px 12px; border-radius: 4px; text-transform: uppercase; border: 1px solid currentColor; letter-spacing: 1px; }
        .status-badge.pendente { color: #ffd700; background: rgba(255, 215, 0, 0.05); }
        .status-badge.pago, .status-badge.aprovado { color: var(--acid-green); background: rgba(204, 255, 0, 0.08); }
        .status-badge.enviado { color: #00f0ff; background: rgba(0, 240, 255, 0.05); }
        .status-badge.entregue { color: #00ff88; background: rgba(0, 255, 136, 0.08); }
        .status-badge.rejeitado { color: var(--red-alert); background: rgba(255, 42, 42, 0.05); }

        .terminal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.03); }
        .grid-cell label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        .grid-cell .main-data { font-size: 0.9rem; font-weight: 600; color: #fff; }
        .grid-cell .email-data { font-size: 0.8rem; color: var(--text-main); margin-top: 2px; word-break: break-all; }
        .grid-cell .sub-data { font-size: 0.75rem; color: var(--acid-green); margin-top: 3px; }
        .grid-cell .total-val { font-family: var(--font-display); font-size: 1.2rem; color: var(--acid-green); text-shadow: var(--acid-glow); }

        .items-panel { display: flex; flex-direction: column; gap: 8px; }
        .item-row { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 15px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px;
        }
        .item-left { display: flex; align-items: center; gap: 15px; }
        .item-left img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        .item-info h4 { font-size: 0.85rem; font-weight: 500; color: #fff; }
        .item-info span { font-size: 0.7rem; color: var(--text-muted); }
        
        .qty-badge { background: rgba(204,255,0,0.1); border: 1px solid var(--acid-green); color: var(--acid-green); width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .item-price { font-size: 0.9rem; color: #fff; font-weight: 600; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .footer-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        .status-select { 
            background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: #fff; 
            padding: 10px 15px; border-radius: 6px; outline: none; font-size: 0.8rem; cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .status-select:focus { border-color: var(--acid-green); }

        /* FORMULÁRIO E PRODUTOS */
        .form-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 30px; border-radius: 16px; margin-bottom: 40px; backdrop-filter: blur(10px); }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .input-box.full { grid-column: span 2; }
        .input-box label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .input-box input, .input-box select { 
            background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); padding: 12px; border-radius: 8px; 
            color: #fff; outline: none; transition: 0.3s;
        }
        .input-box input:focus { border-color: var(--acid-green); box-shadow: inset 0 0 10px rgba(204,255,0,0.1); }
        
        /* OPÇÕES DE TAMANHO COM CHECKBOX */
        .size-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
        .size-checkbox { display: none; }
        .size-label { 
            background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); color: var(--text-muted); 
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 700; transition: 0.2s; user-select: none;
        }
        .size-label:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
        .size-checkbox:checked + .size-label { 
            background: rgba(204, 255, 0, 0.15); border-color: var(--acid-green); color: var(--acid-green); box-shadow: 0 0 10px rgba(204,255,0,0.2);
        }

        .form-actions { display: flex; gap: 15px; margin-top: 20px; }
        .btn-submit { 
            background: var(--acid-green); color: #000; border: none; padding: 15px; 
            border-radius: 8px; font-family: var(--font-display); font-weight: 700; cursor: pointer; flex: 1; transition: 0.3s;
        }
        .btn-submit:hover { box-shadow: var(--acid-glow); }
        .btn-cancel { 
            background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border); padding: 15px; 
            border-radius: 8px; font-family: var(--font-display); font-weight: 700; cursor: pointer; display: none; transition: 0.3s;
        }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }

        @media (max-width: 1024px) {
            .terminal-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; padding: 20px; border-right: none; border-bottom: 1px solid var(--glass-border); }
            .nav-menu { flex-direction: row; justify-content: center; overflow-x: auto; }
            .main-content { height: auto; padding: 20px; }
            .terminal-grid { grid-template-columns: 1fr; }
            .input-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">Magnata<span>Imperium</span></div>
        <nav class="nav-menu">
            <button class="nav-btn active" data-target="view-pedidos">🛒 Terminal de Pedidos</button>
            <button class="nav-btn" data-target="view-produtos">📦 Base de Produtos</button>
        </nav>
    </aside>

    <main class="main-content">
        
        <!-- VISUALIZAÇÃO DE PEDIDOS -->
        <section id="view-pedidos" class="view-section active">
            <div class="header-row">
                <h1>DASHBOARD // VENDAS</h1>
                <button class="btn-danger-glass" onclick="limparTodosPedidos()">[🗑️] Purge Data</button>
            </div>

            <div class="profit-terminal">
                <div class="profit-label">Lucro Total Confirmado</div>
                <div class="profit-value" id="total-lucro">R$ 0,00</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Status base: Pago / Enviado / Entregue</div>
            </div>

            <div class="admin-tabs" id="order-tabs">
                <button class="tab-btn active" data-filter="todos">Todos</button>
                <button class="tab-btn" data-filter="pendente">Pendentes</button>
                <button class="tab-btn" data-filter="pago">Pagos</button>
                <button class="tab-btn" data-filter="enviado">Enviados</button>
                <button class="tab-btn" data-filter="entregue">Entregues</button>
                <button class="tab-btn" data-filter="rejeitado">Rejeitados</button>
            </div>

            <div id="order-list" class="order-list"></div>
        </section>

        <!-- VISUALIZAÇÃO DE PRODUTOS -->
        <section id="view-produtos" class="view-section">
            <div class="header-row">
                <h1>CATÁLOGO // DATABASE</h1>
            </div>
            
            <div class="form-panel">
                <form id="form-produto">
                    <div class="input-grid">
                        <div class="input-box full">
                            <label>Nome do Item</label>
                            <input type="text" id="prod-nome" required placeholder="Ex: Calça Cargo Streetwear / Agasalho / Tênis Nike">
                        </div>
                        <div class="input-box">
                            <label>Categoria</label>
                            <select id="prod-categoria" required>
                                <option value="camisas">Camisas Casuais</option>
                                <option value="camisas-time">Camisas de Time / Seleções</option>
                                <option value="agasalhos">Agasalhos</option>
                                <option value="calcas-cargo">SHORTS</option>
                                <option value="calcas-alfaiataria">CUECAS</option>
                                <option value="moletons">Moletons</option>
                                <option value="calcas">Calças</option>
                                <option value="conjuntos">Conjuntos</option>
                                <option value="tenis">Tênis</option>
                                <option value="chinelos">Chinelos</option>
                                <option value="bones">Bonés</option>
                                <option value="perfumes">Acessórios</option>
                                <option value="promocoes">Promoções</option>
                            </select>
                        </div>
                        <div class="input-box">
                            <label id="label-preco">Preço Unitário (R$)</label>
                            <input type="number" step="0.01" id="prod-preco" required>
                        </div>
                        
                        <!-- PREÇO PROMOCIONAL -->
                        <div class="input-box" id="box-preco-original" style="display: none;">
                            <label>Preço Original / Riscado (R$)</label>
                            <input type="number" step="0.01" id="prod-preco-original">
                        </div>

                        <!-- SELEÇÃO DE TAMANHOS: ROUPAS -->
                        <div class="input-box full" id="box-tamanhos-roupas">
                            <label>Tamanhos Disponíveis (Roupas)</label>
                            <div class="size-options">
                                <input type="checkbox" id="sz-pp" value="PP" class="size-checkbox"><label for="sz-pp" class="size-label">PP</label>
                                <input type="checkbox" id="sz-p" value="P" class="size-checkbox"><label for="sz-p" class="size-label">P</label>
                                <input type="checkbox" id="sz-m" value="M" class="size-checkbox"><label for="sz-m" class="size-label">M</label>
                                <input type="checkbox" id="sz-g" value="G" class="size-checkbox"><label for="sz-g" class="size-label">G</label>
                                <input type="checkbox" id="sz-gg" value="GG" class="size-checkbox"><label for="sz-gg" class="size-label">GG</label>
                                <input type="checkbox" id="sz-xg" value="XG" class="size-checkbox"><label for="sz-xg" class="size-label">XG</label>
                            </div>
                        </div>

                        <!-- SELEÇÃO DE TAMANHOS: CALÇAS (NUMÉRICA) -->
                        <div class="input-box full" id="box-tamanhos-calcas" style="display: none;">
                            <label>Tamanhos Disponíveis (Calças - Numeração)</label>
                            <div class="size-options">
                                <input type="checkbox" id="sz-36" value="36" class="size-checkbox"><label for="sz-36" class="size-label">36</label>
                                <input type="checkbox" id="sz-38" value="38" class="size-checkbox"><label for="sz-38" class="size-label">38</label>
                                <input type="checkbox" id="sz-40" value="40" class="size-checkbox"><label for="sz-40" class="size-label">40</label>
                                <input type="checkbox" id="sz-42" value="42" class="size-checkbox"><label for="sz-42" class="size-label">42</label>
                                <input type="checkbox" id="sz-44" value="44" class="size-checkbox"><label for="sz-44" class="size-label">44</label>
                                <input type="checkbox" id="sz-46" value="46" class="size-checkbox"><label for="sz-46" class="size-label">46</label>
                                <input type="checkbox" id="sz-48" value="48" class="size-checkbox"><label for="sz-48" class="size-label">48</label>
                                <input type="checkbox" id="sz-50" value="50" class="size-checkbox"><label for="sz-50" class="size-label">50</label>
                            </div>
                        </div>

                        <!-- SELEÇÃO DE TAMANHOS: CALÇADOS -->
                        <div class="input-box full" id="box-tamanhos-calcados" style="display: none;">
                            <label>Tamanhos Disponíveis (Calçados / Tênis / Chinelos)</label>
                            <div class="size-options">
                                <input type="checkbox" id="sz-3536" value="35/36" class="size-checkbox"><label for="sz-3536" class="size-label">35/36</label>
                                <input type="checkbox" id="sz-3738" value="37/38" class="size-checkbox"><label for="sz-3738" class="size-label">37/38</label>
                                <input type="checkbox" id="sz-3940" value="39/40" class="size-checkbox"><label for="sz-3940" class="size-label">39/40</label>
                                <input type="checkbox" id="sz-4142" value="41/42" class="size-checkbox"><label for="sz-4142" class="size-label">41/42</label>
                                <input type="checkbox" id="sz-4344" value="43/44" class="size-checkbox"><label for="sz-4344" class="size-label">43/44</label>

                                <input type="checkbox" id="sz-37" value="37" class="size-checkbox"><label for="sz-37" class="size-label">37</label>
                                <input type="checkbox" id="sz-38-shoe" value="38" class="size-checkbox"><label for="sz-38-shoe" class="size-label">38</label>
                                <input type="checkbox" id="sz-39" value="39" class="size-checkbox"><label for="sz-39" class="size-label">39</label>
                                <input type="checkbox" id="sz-40-shoe" value="40" class="size-checkbox"><label for="sz-40-shoe" class="size-label">40</label>
                                <input type="checkbox" id="sz-41" value="41" class="size-checkbox"><label for="sz-41" class="size-label">41</label>
                                <input type="checkbox" id="sz-42-shoe" value="42" class="size-checkbox"><label for="sz-42-shoe" class="size-label">42</label>
                                <input type="checkbox" id="sz-43" value="43" class="size-checkbox"><label for="sz-43" class="size-label">43</label>
                                <input type="checkbox" id="sz-44-shoe" value="44" class="size-checkbox"><label for="sz-44-shoe" class="size-label">44</label>
                            </div>
                        </div>

                        <!-- SELEÇÃO DE TAMANHOS: ACESSÓRIOS -->
                        <div class="input-box full" id="box-tamanhos-unico" style="display: none;">
                            <label>Tamanho Disponível (Acessórios)</label>
                            <div class="size-options">
                                <input type="checkbox" id="sz-unico" value="Tamanho Único" class="size-checkbox" checked><label for="sz-unico" class="size-label">Tamanho Único</label>
                            </div>
                        </div>

                        <div class="input-box full">
                            <label>Imagem Source URL</label>
                            <input type="url" id="prod-img" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit" id="btn-submit">CADASTRAR PRODUTO</button>
                        <button type="button" class="btn-cancel" id="btn-cancelar" onclick="cancelarEdicao()">CANCELAR EDIÇÃO</button>
                    </div>
                </form>
            </div>

            <!-- ABAS DE FILTRO DE PRODUTOS POR CATEGORIA -->
            <div class="admin-tabs" id="product-tabs">
                <button class="tab-btn active" data-filter="todos">Todos</button>
                <button class="tab-btn" data-filter="camisas">Camisas Casuais</button>
                <button class="tab-btn" data-filter="camisas-time">Camisas de Time</button>
                <button class="tab-btn" data-filter="agasalhos">Agasalhos</button>
                <button class="tab-btn" data-filter="calcas-cargo">Calças Cargo</button>
                <button class="tab-btn" data-filter="calcas-alfaiataria">Alfaiataria</button>
                <button class="tab-btn" data-filter="moletons">Moletons</button>
                <button class="tab-btn" data-filter="calcas">Calças</button>
                <button class="tab-btn" data-filter="conjuntos">Conjuntos</button>
                <button class="tab-btn" data-filter="tenis">Tênis</button>
                <button class="tab-btn" data-filter="chinelos">Chinelos</button>
                <button class="tab-btn" data-filter="bones">Bonés</button>
                <button class="tab-btn" data-filter="perfumes">Acessórios</button>
                <button class="tab-btn" data-filter="promocoes">Promoções</button>
            </div>

            <!-- LISTA DE PRODUTOS -->
            <div id="product-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;"></div>
        </section>

    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // CONFIG FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDTc82lRFwmkn0zbNpXyBTIpeXM5WcdOfY",
            authDomain: "loja-de-roupa-59097.firebaseapp.com",
            projectId: "loja-de-roupa-59097",
            storageBucket: "loja-de-roupa-59097.firebasestorage.app",
            messagingSenderId: "845269655704",
            appId: "1:845269655704:web:ca81f9fc07351fd4b5b0ed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const formatCurrency = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        window.produtosCache = {};
        let editandoId = null;

        // NAVEGAÇÃO
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn, .view-section').forEach(el => el.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.target).classList.add('active');
            });
        });

        // ================= FILTRO DE ABAS (PEDIDOS) =================
        let filtroAtual = 'todos';

        document.querySelectorAll('#order-tabs .tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#order-tabs .tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                filtroAtual = e.target.dataset.filter;
                aplicarFiltroPedidos();
            });
        });

        function aplicarFiltroPedidos() {
            document.querySelectorAll('.order-card').forEach(card => {
                const cardStatus = (card.dataset.status || '').toLowerCase();
                
                if (filtroAtual === 'todos') {
                    card.style.display = 'flex';
                } else if (filtroAtual === 'pago') {
                    if (cardStatus.includes('pago') || cardStatus.includes('aprovado')) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                } else {
                    if (cardStatus.includes(filtroAtual)) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                }
            });
        }

        // ================= FILTRO DE ABAS (PRODUTOS POR CATEGORIA) =================
        let filtroProdutoAtual = 'todos';

        document.querySelectorAll('#product-tabs .tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#product-tabs .tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                filtroProdutoAtual = e.target.dataset.filter;
                aplicarFiltroProdutos();
            });
        });

        function aplicarFiltroProdutos() {
            const productCards = document.querySelectorAll('.product-card');
            productCards.forEach(card => {
                const cardCat = card.dataset.categoria || '';
                
                if (filtroProdutoAtual === 'todos' || cardCat === filtroProdutoAtual) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // ================= PEDIDOS EM TEMPO REAL =================
        const orderListDiv = document.getElementById('order-list');
        const lucroUI = document.getElementById('total-lucro');

        db.collection("pedidos").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            orderListDiv.innerHTML = "";
            let totalProfit = 0;

            if (snapshot.empty) {
                orderListDiv.innerHTML = "<p style='color: var(--text-muted);'>Nenhum registro encontrado no banco de dados.</p>";
                lucroUI.textContent = "R$ 0,00";
                return;
            }

            snapshot.forEach(doc => {
                const p = doc.data();
                const id = doc.id;
                const statusNormalizado = (p.status || 'pendente').toLowerCase();

                if (statusNormalizado.includes('pago') || statusNormalizado.includes('aprovado') || statusNormalizado.includes('enviado') || statusNormalizado.includes('entregue')) {
                    totalProfit += (p.totals?.finalTotal || 0);
                }

                const date = p.createdAt?.toDate().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) || "00/00/0000";

                let itemsHtml = p.items?.map(item => `
                    <div class="item-row">
                        <div class="item-left">
                            <img src="${item.img || ''}" alt="${item.name}">
                            <div class="item-info">
                                <h4>${item.name || 'Produto'}</h4>
                                <span>Tamanho: ${item.size || 'Único'}</span>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap: 20px;">
                            <div class="qty-badge">${item.quantity || 1}</div>
                            <div class="item-price">${formatCurrency(item.price || 0)}</div>
                        </div>
                    </div>
                `).join('') || "";

                let badgeClass = 'pendente';
                if (statusNormalizado.includes('pago') || statusNormalizado.includes('aprovado')) badgeClass = 'pago';
                else if (statusNormalizado.includes('enviado')) badgeClass = 'enviado';
                else if (statusNormalizado.includes('entregue')) badgeClass = 'entregue';
                else if (statusNormalizado.includes('rejeitado')) badgeClass = 'rejeitado';

                const card = document.createElement('div');
                card.className = `order-card ${badgeClass === 'rejeitado' ? 'rejeitado' : ''}`;
                card.setAttribute('data-status', p.status || 'pendente');
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="order-id">📦 PEDIDO: <span>#${id.substring(0,8).toUpperCase()}</span></div>
                        <div class="status-badge ${badgeClass}">${p.status || 'Pendente'}</div>
                    </div>

                    <div class="terminal-grid">
                        <div class="grid-cell">
                            <label>👤 CLIENTE</label>
                            <div class="main-data">${p.cliente?.nome || 'Nome não informado'}</div>
                            <div class="email-data">${p.cliente?.email || 'Gmail/E-mail N/A'}</div>
                            <div class="sub-data">${p.cliente?.whatsapp || ''}</div>
                        </div>
                        <div class="grid-cell">
                            <label>📅 DATA/HORA</label>
                            <div class="main-data">${date.split(' ')[0]}</div>
                            <div class="sub-data" style="color:var(--text-muted)">${date.split(' ')[1] || ''}</div>
                        </div>
                        
                        <div class="grid-cell">
                            <label>📍 ENDEREÇO</label>
                            <div class="main-data">${p.shipping?.logradouro || ''}, ${p.shipping?.numero || 'S/N'}</div>
                            <div class="sub-data" style="color:var(--text-muted)">
                                ${p.shipping?.bairro || ''} - ${p.shipping?.cidadeUF || ''}
                            </div>
                            ${p.shipping?.complemento ? `<div style="font-size: 0.75rem; color: #a0a0a0; margin-top: 2px;">Comp: ${p.shipping.complemento}</div>` : ''}
                        </div>
                        
                        <div class="grid-cell">
                            <label>💳 TOTAL</label>
                            <div class="total-val">${formatCurrency(p.totals?.finalTotal || 0)}</div>
                            <div class="sub-data" style="color:var(--text-muted)">${p.payment?.method || 'N/A'}</div>
                        </div>
                    </div>

                    <div class="items-panel">
                        <span style="font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; margin-bottom:5px;">Lista de Itens</span>
                        ${itemsHtml}
                    </div>

                    <div class="card-footer">
                        <div>
                            <span class="footer-label">ATUALIZAR STATUS DO PEDIDO</span>
                            <select class="status-select" onchange="updateStatus('${id}', this.value)">
                                <option value="pendente" ${statusNormalizado === 'pendente' ? 'selected' : ''}>⏳ Pendente</option>
                                <option value="Aprovado (Pago)" ${(statusNormalizado.includes('pago') || statusNormalizado.includes('aprovado')) ? 'selected' : ''}>💳 Pago / Aprovado</option>
                                <option value="enviado" ${statusNormalizado === 'enviado' ? 'selected' : ''}>🚚 Enviado</option>
                                <option value="entregue" ${statusNormalizado === 'entregue' ? 'selected' : ''}>✅ Entregue</option>
                                <option value="rejeitado" ${statusNormalizado === 'rejeitado' ? 'selected' : ''}>❌ Rejeitado</option>
                            </select>
                        </div>
                        <button class="btn-danger-glass" onclick="rejeitarPedido('${id}')" style="align-self: flex-end;">[X] Rejeitar</button>
                    </div>
                `;

                orderListDiv.appendChild(card);
            });

            lucroUI.textContent = formatCurrency(totalProfit);
            aplicarFiltroPedidos();
        });

        async function updateStatus(id, val) {
            try {
                await db.collection("pedidos").doc(id).update({ 
                    status: val,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error("Erro ao atualizar status:", error);
                alert("Erro ao alterar o status do pedido.");
            }
        }

        async function rejeitarPedido(id) {
            if(confirm("Deseja rejeitar este pedido e removê-lo dos lucros?")) {
                await updateStatus(id, 'rejeitado');
            }
        }

        async function limparTodosPedidos() {
            const confirmacao = prompt("⚠️ PERIGO: Isso apagará TODOS os pedidos do servidor.\nDigite CONFIRMAR em maiúsculas para continuar:");
            if (confirmacao === 'CONFIRMAR') {
                try {
                    const snapshot = await db.collection("pedidos").get();
                    if (snapshot.empty) { alert("Nenhum pedido para limpar."); return; }
                    const batch = db.batch();
                    snapshot.forEach(doc => { batch.delete(doc.ref); });
                    await batch.commit();
                    alert("A purga de dados foi concluída com sucesso.");
                } catch (error) {
                    console.error(error); alert("Erro na comunicação com o banco de dados.");
                }
            } else if (confirmacao !== null) {
                alert("Palavra incorreta. Purga cancelada.");
            }
        }

        // ================= LÓGICA DE PRODUTOS & EDITAR =================
        const formProd = document.getElementById('form-produto');
        const catSelect = document.getElementById('prod-categoria');
        const boxPrecoOriginal = document.getElementById('box-preco-original');
        const boxTamanhosRoupas = document.getElementById('box-tamanhos-roupas');
        const boxTamanhosCalcados = document.getElementById('box-tamanhos-calcados');
        const boxTamanhosCalcas = document.getElementById('box-tamanhos-calcas');
        const boxTamanhosUnico = document.getElementById('box-tamanhos-unico');
        const labelPreco = document.getElementById('label-preco');
        const inputPrecoOriginal = document.getElementById('prod-preco-original');

        function atualizarVisibilidadeCampos() {
            const cat = catSelect.value;

            // Lógica de Preço Promocional
            if (cat === 'promocoes') {
                boxPrecoOriginal.style.display = 'flex';
                inputPrecoOriginal.required = true;
                labelPreco.textContent = 'Preço Promocional (R$)';
            } else {
                boxPrecoOriginal.style.display = 'none';
                inputPrecoOriginal.required = false;
                inputPrecoOriginal.value = '';
                labelPreco.textContent = 'Preço Unitário (R$)';
            }

            // Oculta todas as opções de tamanhos por padrão
            boxTamanhosRoupas.style.display = 'none';
            boxTamanhosCalcados.style.display = 'none';
            boxTamanhosCalcas.style.display = 'none';
            boxTamanhosUnico.style.display = 'none';

            // Exibe a caixa de tamanho apropriada
            if (['tenis', 'chinelos'].includes(cat)) {
                boxTamanhosCalcados.style.display = 'flex';
            } else if (['calcas', 'calcas-cargo', 'calcas-alfaiataria'].includes(cat)) {
                boxTamanhosCalcas.style.display = 'flex';
            } else if (['perfumes', 'bones'].includes(cat)) {
                boxTamanhosUnico.style.display = 'flex';
            } else if (['camisas', 'camisas-time', 'agasalhos', 'moletons', 'conjuntos'].includes(cat)) {
                boxTamanhosRoupas.style.display = 'flex';
            } else if (cat === 'promocoes') {
                boxTamanhosRoupas.style.display = 'flex';
                boxTamanhosCalcados.style.display = 'flex';
                boxTamanhosCalcas.style.display = 'flex';
                boxTamanhosUnico.style.display = 'flex';
            }
        }

        catSelect.addEventListener('change', atualizarVisibilidadeCampos);

        function getTamanhosSelecionados() {
            const selecionados = [];
            document.querySelectorAll('.size-checkbox:checked').forEach(cb => {
                const parentBox = cb.closest('.input-box');
                if (parentBox && parentBox.style.display !== 'none') {
                    selecionados.push(cb.value);
                }
            });
            return selecionados;
        }

        formProd.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.textContent = "PROCESSANDO...";

            const precoVal = parseFloat(document.getElementById('prod-preco').value);
            const precoOriginalVal = inputPrecoOriginal.value ? parseFloat(inputPrecoOriginal.value) : null;
            const categoriaVal = catSelect.value;
            const tamanhosVal = getTamanhosSelecionados();

            try {
                const produtoData = {
                    nome: document.getElementById('prod-nome').value,
                    preco: precoVal,
                    img: document.getElementById('prod-img').value,
                    categoria: categoriaVal,
                    tamanhos: tamanhosVal
                };

                if (categoriaVal === 'promocoes' && precoOriginalVal) {
                    produtoData.precoOriginal = precoOriginalVal;
                }

                if (editandoId) {
                    produtoData.atualizadoEm = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection("produtos").doc(editandoId).update(produtoData);
                    alert("Produto atualizado com sucesso!");
                    cancelarEdicao();
                } else {
                    produtoData.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection("produtos").add(produtoData);
                    alert("Produto cadastrado com sucesso!");
                    cancelarEdicao();
                }
            } catch (error) {
                console.error(error);
                alert("Erro ao salvar produto.");
            } finally {
                btnSubmit.textContent = editandoId ? "SALVAR ALTERAÇÕES" : "CADASTRAR PRODUTO";
            }
        });

        // CARREGAR PRODUTOS EM TEMPO REAL
        db.collection("produtos").orderBy("criadoEm", "desc").onSnapshot(snap => {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            window.produtosCache = {};

            if (snap.empty) {
                list.innerHTML = "<p style='color: var(--text-muted); grid-column: span 3;'>Nenhum produto cadastrado no catálogo.</p>";
                return;
            }

            snap.forEach(doc => {
                const p = doc.data();
                window.produtosCache[doc.id] = p;

                let precoHtml = `<div style="color:var(--acid-green); font-family:var(--font-display); font-size:1rem; margin-bottom:10px;">${formatCurrency(p.preco || 0)}</div>`;
                
                if (p.categoria === 'promocoes' && p.precoOriginal) {
                    precoHtml = `
                        <div style="font-family:var(--font-display); margin-bottom:10px; display:flex; align-items:baseline; gap:8px;">
                            <span style="text-decoration: line-through; color: var(--text-muted); font-size: 0.8rem;">${formatCurrency(p.precoOriginal)}</span>
                            <span style="color:var(--acid-green); font-size:1rem;">${formatCurrency(p.preco || 0)}</span>
                        </div>
                    `;
                }

                const tamanhosTxt = (p.tamanhos && p.tamanhos.length > 0) 
                    ? p.tamanhos.join(', ') 
                    : 'Sem tamanhos';

                list.innerHTML += `
                    <div class="product-card" data-categoria="${p.categoria || ''}" style="background:var(--glass-bg); padding:15px; border-radius:12px; border:1px solid var(--glass-border); display:flex; flex-direction:column; justify-content:space-between;">
                        <div>
                            <img src="${p.img}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.05);">
                            <h4 style="font-size:0.85rem; margin-bottom:4px; color:#fff;">${p.nome}</h4>
                            <span style="font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:4px;">Cat: ${p.categoria || 'N/A'}</span>
                            <span style="font-size:0.7rem; color:var(--acid-green); display:block; margin-bottom:10px;">Tam: ${tamanhosTxt}</span>
                            ${precoHtml}
                        </div>
                        <div style="display:flex; flex-direction:column; gap:8px;">
                            <button onclick="editProd('${doc.id}')" class="btn-edit-glass" style="width:100%;">Editar</button>
                            <button onclick="deleteProd('${doc.id}')" class="btn-danger-glass" style="width:100%;">Excluir</button>
                        </div>
                    </div>
                `;
            });

            aplicarFiltroProdutos();
        });

        function editProd(id) {
            const p = window.produtosCache[id];
            if (!p) return;

            editandoId = id;
            document.getElementById('prod-nome').value = p.nome || '';
            document.getElementById('prod-categoria').value = p.categoria || 'camisas';
            document.getElementById('prod-preco').value = p.preco || '';
            document.getElementById('prod-preco-original').value = p.precoOriginal || '';
            document.getElementById('prod-img').value = p.img || '';

            atualizarVisibilidadeCampos();

            document.querySelectorAll('.size-checkbox').forEach(cb => {
                cb.checked = p.tamanhos ? p.tamanhos.includes(cb.value) : false;
            });

            document.getElementById('btn-submit').textContent = "SALVAR ALTERAÇÕES";
            document.getElementById('btn-cancelar').style.display = "block";
            
            document.getElementById('form-produto').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelarEdicao() {
            editandoId = null;
            formProd.reset();
            atualizarVisibilidadeCampos();
            document.querySelectorAll('.size-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('btn-submit').textContent = "CADASTRAR PRODUTO";
            document.getElementById('btn-cancelar').style.display = "none";
        }

        async function deleteProd(id) {
            if(confirm("Remover item do banco de dados?")) {
                await db.collection("produtos").doc(id).delete();
                if (editandoId === id) cancelarEdicao();
            }
        }

        atualizarVisibilidadeCampos();
    </script>
</body>
</html>
