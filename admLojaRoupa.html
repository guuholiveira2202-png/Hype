<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Magnata Imperium</title>
    
    <!-- Firebase SDK (Compat v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --acid-green: #00ff88;
            --danger-red: #ff4d4d;
            --text-main: #ffffff;
            --text-muted: #8a8d9b;
            --font-display: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-display);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        /* HEADER & DASHBOARD ACCENT */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: #fff;
        }

        header h1 span {
            color: var(--acid-green);
        }

        .lucro-card {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 10px 20px;
            border-radius: 12px;
            text-align: right;
        }

        .lucro-card span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .lucro-card #total-lucro {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--acid-green);
        }

        /* NAVEGAÇÃO */
        nav {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .nav-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-btn.active, .nav-btn:hover {
            background: var(--acid-green);
            color: #000;
            border-color: var(--acid-green);
        }

        /* SEÇÕES */
        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* ABAS E AÇÕES DE PEDIDOS */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        #order-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: #fff;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        /* CARDS DE PEDIDO */
        .order-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card.rejeitado {
            opacity: 0.5;
            border-color: rgba(255, 77, 77, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 12px;
        }

        .order-id span {
            color: var(--acid-green);
            font-weight: bold;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.pendente { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .status-badge.pago { background: rgba(0, 255, 136, 0.15); color: var(--acid-green); }
        .status-badge.enviado { background: rgba(13, 110, 253, 0.15); color: #0d6efd; }
        .status-badge.entregue { background: rgba(25, 135, 84, 0.15); color: #198754; }
        .status-badge.rejeitado { background: rgba(255, 77, 77, 0.15); color: var(--danger-red); }

        .terminal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
        }

        .grid-cell label {
            display: block;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .grid-cell .main-data { font-weight: 600; font-size: 0.9rem; }
        .grid-cell .sub-data { font-size: 0.8rem; color: #aaa; }
        .grid-cell .email-data { font-size: 0.8rem; color: #aaa; word-break: break-all; }
        .grid-cell .total-val { color: var(--acid-green); font-size: 1.1rem; font-weight: bold; }

        .items-panel {
            background: rgba(0, 0, 0, 0.15);
            padding: 12px;
            border-radius: 10px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .item-row:last-child { border-bottom: none; }

        .item-left { display: flex; align-items: center; gap: 12px; }
        .item-left img { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; }

        .qty-badge {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-top: 1px solid var(--glass-border);
            padding-top: 15px;
        }

        .status-select {
            background: #15161d;
            color: #fff;
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
        }

        /* BOTÕES GERAIS */
        button {
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-superfrete {
            background: #0066ff;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-superfrete:hover { background: #0052cc; }

        .btn-danger-glass {
            background: rgba(255, 77, 77, 0.1);
            color: var(--danger-red);
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
        }

        .btn-danger-glass:hover { background: var(--danger-red); color: #fff; }

        .btn-edit-glass {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 8px;
        }

        .btn-edit-glass:hover { background: rgba(255, 255, 255, 0.15); }

        /* FORMULÁRIO DE PRODUTOS */
        .form-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-box label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .input-box input, .input-box select {
            background: #15161d;
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
            text-transform: none;
            color: #fff;
            cursor: pointer;
        }

        .product-grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>MAGNATA <span>IMPERIUM</span></h1>
        <div class="lucro-card">
            <span>Faturamento Aprovado</span>
            <div id="total-lucro">R$ 0,00</div>

    </header>

    <nav>

        <button class="nav-btn" data-target="sec-produtos">🏷️ Produtos</button>

    <!-- ================= SEÇÃO: PEDIDOS ================= -->
    <section id="sec-pedidos" class="view-section active">
        <div class="controls-bar">
            <div id="order-tabs">
                <button class="tab-btn active" data-filter="todos">Todos</button>
                <button class="tab-btn" data-filter="pago">Pagos/Aprovados</button>
                <button class="tab-btn" data-filter="pendente">Pendentes</button>
                <button class="tab-btn" data-filter="enviado">Enviados</button>
                <button class="tab-btn" data-filter="rejeitado">Rejeitados</button>
            </div>
            <div class="action-btns">
                <button id="btn-envio-geral" class="btn-superfrete" onclick="enviarTodosParaSuperFrete()">🚀 Enviar Pedidos Pagos p/ SuperFrete</button>

        <div id="order-list">

        <div class="form-container">

            <form id="form-produto">

                    <div class="input-box">

                        <input type="text" id="prod-nome" required placeholder="Ex: Camisa Oversized">
                    </div>
                    <div class="input-box">
                        <label>Categoria</label>
                        <select id="prod-categoria" required>

                            <option value="camisas-time">Camisas de Time</option>
                            <option value="agasalhos">Agasalhos</option>
                            <option value="calcas-cargo">Calças Cargo</option>
                            <option value="calcas-alfaiataria">Calças Alfaiataria</option>
                            <option value="moletons">Moletons</option>
                            <option value="calcas">Calças</option>
                            <option value="conjuntos">Conjuntos</option>
                            <option value="tenis">Tênis</option>
                            <option value="chinelos">Chinelos</option>
                            <option value="promocoes">Promoções</option>
                        </select>

                    <div class="input-box" id="box-preco-original" style="display:none;">
                        <label>Preço Original (R$)</label>
                        <input type="number" step="0.01" id="prod-preco-original" placeholder="0.00">
                    </div>
                    <div class="input-box">
                        <label id="label-preco">Preço Unitário (R$)</label>
                        <input type="number" step="0.01" id="prod-preco" required placeholder="0.00">

                    <div class="input-box">
                        <label>URL da Imagem</label>
                        <input type="url" id="prod-img" required placeholder="https://...">

                <div class="input-box" id="box-tamanhos-roupas" style="margin-bottom: 15px;">
                    <label>Tamanhos (Roupas)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" class="size-checkbox" value="P"> P</label>
                        <label><input type="checkbox" class="size-checkbox" value="M"> M</label>
                        <label><input type="checkbox" class="size-checkbox" value="G"> G</label>
                        <label><input type="checkbox" class="size-checkbox" value="GG"> GG</label>
                        <label><input type="checkbox" class="size-checkbox" value="XG"> XG</label>

                </div>

                <div class="input-box" id="box-tamanhos-calcados" style="margin-bottom: 15px; display:none;">
                    <label>Tamanhos (Calçados)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" class="size-checkbox" value="38"> 38</label>
                        <label><input type="checkbox" class="size-checkbox" value="39"> 39</label>
                        <label><input type="checkbox" class="size-checkbox" value="40"> 40</label>
                        <label><input type="checkbox" class="size-checkbox" value="41"> 41</label>
                        <label><input type="checkbox" class="size-checkbox" value="42"> 42</label>
                        <label><input type="checkbox" class="size-checkbox" value="43"> 43</label>
                        <label><input type="checkbox" class="size-checkbox" value="44"> 44</label>
                    </div>
                </div>

                <div style="display:flex; gap:10px;">
                    <button type="submit" id="btn-submit" class="btn-superfrete" style="background:var(--acid-green); color:#000;">CADASTRAR PRODUTO</button>
                    <button type="button" id="btn-cancelar" class="btn-danger-glass" style="display:none;" onclick="cancelarEdicao()">Cancelar</button>
                </div>
            </form>
        </div>

        <div id="product-list" class="product-grid-view">
            <!-- Produtos renderizados via JS -->
        </div>
    </section>

    <!-- ================= JAVASCRIPT INTEGRADO ================= -->
    <script>
        // CONFIG TOKEN SUPERFRETE
        const SUPERFRETE_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3ODU3ODIzMzksInN1YiI6IjBRa2w2ak44V3ZoNno4dzNaUENFU0dBVFZLMTIifQ.WpOfGKBeqydGDYHcksFHo4UUhVZRPqKfUMjb7aJPKiI";

        // DADOS DO SEU ENDEREÇO DE ORIGEM / REMETENTE
        const REMETENTE_ORIGEM = {
            name: "Magnata Imperium",
            phone: "11999999999",
            email: "contato@magnataimperium.com",
            document: "11122233344", // ⚠️ Insira um CPF ou CNPJ real válido
            company_name: "Magnata Imperium",
            postal_code: "01001000",
            address: "Praça da Sé",
            number: "100",
            district: "Centro",
            city: "São Paulo",
            state_code: "SP"
        };

        // CONFIG FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDTc82lRFwmkn0zbNpXyBTIpeXM5WcdOfY",
            authDomain: "loja-de-roupa-59097.firebaseapp.com",
            projectId: "loja-de-roupa-59097",
            storageBucket: "loja-de-roupa-59097.firebasestorage.app",
            messagingSenderId: "845269655704",
            appId: "1:845269655704:web:ca81f9fc07351fd4b5b0ed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const formatCurrency = (v) => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        window.produtosCache = {};
        window.pedidosCache = [];
        let editandoId = null;

        // NAVEGAÇÃO
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn, .view-section').forEach(el => el.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.target).classList.add('active');
            });
        });

        // ================= FILTRO DE ABAS =================
        let filtroAtual = 'todos';

        document.querySelectorAll('#order-tabs .tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#order-tabs .tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                filtroAtual = e.target.dataset.filter;
                aplicarFiltroPedidos();
            });
        });

        function aplicarFiltroPedidos() {
            document.querySelectorAll('.order-card').forEach(card => {
                const cardStatus = (card.dataset.status || '').toLowerCase();
                
                if (filtroAtual === 'todos') {
                    card.style.display = 'flex';
                } else if (filtroAtual === 'pago') {
                    if (cardStatus.includes('pago') || cardStatus.includes('aprovado')) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                } else {
                    if (cardStatus.includes(filtroAtual)) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                }
            });
        }

        // ================= INTEGRAÇÃO API SUPERFRETE =================
        async function enviarPedidoAPI(p) {
            const targetUrl = "https://api.superfrete.com/api/v2/cart";
            const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(targetUrl);

            const cepLimpo = (p.shipping?.cep || "").replace(/\D/g, '');
            if (!cepLimpo || cepLimpo.length !== 8) {
                throw new Error(`CEP Inválido ou Ausente (${p.shipping?.cep || 'vazio'})`);
            }

            const payload = {
                from: {
                    ...REMETENTE_ORIGEM,
                    postal_code: REMETENTE_ORIGEM.postal_code.replace(/\D/g, ''),
                    phone: REMETENTE_ORIGEM.phone.replace(/\D/g, ''),
                    document: REMETENTE_ORIGEM.document.replace(/\D/g, '')
                },
                to: {
                    name: p.cliente?.nome || "Cliente Imperium",
                    phone: (p.cliente?.whatsapp || "11999999999").replace(/\D/g, ''),
                    email: p.cliente?.email || "contato@cliente.com",
                    document: (p.cliente?.cpf || "00000000000").replace(/\D/g, ''),
                    postal_code: cepLimpo,
                    address: p.shipping?.logradouro || "Rua Principal",
                    number: p.shipping?.numero || "10",
                    district: p.shipping?.bairro || "Bairro",
                    city: (p.shipping?.cidadeUF || "Sao Paulo/SP").split('/')[0].trim(),
                    state_code: (p.shipping?.cidadeUF || "SP").split('/')[1]?.trim() || "SP",
                    note: `Pedido #${p.id.substring(0,8).toUpperCase()}`
                },
                products: p.items?.map(i => ({
                    name: i.name || "Item Magnata",
                    quantity: Number(i.quantity) || 1,
                    unitary_value: Number(i.price) || 10
                })) || [],
                volumes: [{
                    height: 10,
                    width: 15,
                    length: 20,
                    weight: 0.5
                }],
                options: {
                    insurance_value: Number(p.totals?.finalTotal) || 0,
                    receipt: false,
                    own_hand: false,
                    reverse: false,
                    non_commercial: true
                },
                service: 1
            };

            let response;
            try {
                response = await fetch(proxyUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${SUPERFRETE_TOKEN}`,
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                throw new Error(`Falha ao conectar à API/Proxy: ${err.message}`);
            }

            const resText = await response.text();
            let jsonResult;

            try {
                jsonResult = JSON.parse(resText);
            } catch (e) {
                throw new Error(`A API não retornou um JSON válido. Resposta recebida:\n\n${resText.substring(0, 300)}`);
            }

            if (!response.ok) {
                const erroDetalhado = jsonResult.message || jsonResult.error || JSON.stringify(jsonResult);
                throw new Error(`Status ${response.status}: ${erroDetalhado}`);
            }

            return jsonResult;
        }

        async function enviarPedidoSuperFrete(id) {
            const p = window.pedidosCache.find(item => item.id === id);
            if (!p) {
                alert("Pedido não localizado.");
                return;
            }

            try {
                alert(`Iniciando envio do pedido #${id.substring(0,8).toUpperCase()} ao SuperFrete...`);
                await enviarPedidoAPI(p);
                await updateStatus(id, 'enviado');
                alert(`✅ Sucesso! O Pedido #${id.substring(0,8).toUpperCase()} foi inserido no seu carrinho do SuperFrete e marcado como enviado.`);
            } catch (error) {
                console.error("Erro na API SuperFrete:", error);
                alert(`❌ Erro ao enviar para o SuperFrete:\n${error.message}`);
            }
        }

        async function enviarTodosParaSuperFrete() {
            const btnGeral = document.getElementById('btn-envio-geral');
            
            const pedidosPagos = window.pedidosCache.filter(p => {
                const st = (p.status || '').toLowerCase();
                return st.includes('pago') || st.includes('aprovado');
            });
            
            if (pedidosPagos.length === 0) {
                alert("Nenhum pedido com status 'Pago' ou 'Aprovado' encontrado no momento.");
                return;
            }

            if (!confirm(`Deseja enviar ${pedidosPagos.length} pedido(s) PAGOS para a API do SuperFrete?`)) return;

            btnGeral.disabled = true;
            btnGeral.textContent = "ENVIANDO PAGOS...";

            let acertos = 0;
            let erros = 0;

            for (const p of pedidosPagos) {
                try {
                    await enviarPedidoAPI(p);
                    await updateStatus(p.id, 'enviado');
                    acertos++;
                } catch (err) {
                    console.error(`Erro no Pedido #${p.id}:`, err);
                    erros++;
                }
            }

            btnGeral.disabled = false;
            btnGeral.innerHTML = "🚀 Enviar Pedidos Pagos p/ SuperFrete";
            alert(`Processo concluído!\n\n✅ Sucessos: ${acertos}\n❌ Falhas: ${erros}\n\nAcesse sua conta do SuperFrete para emitir as etiquetas no carrinho.`);
        }

        // ================= PEDIDOS EM TEMPO REAL =================
        const orderListDiv = document.getElementById('order-list');
        const lucroUI = document.getElementById('total-lucro');

        db.collection("pedidos").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            orderListDiv.innerHTML = "";
            let totalProfit = 0;
            window.pedidosCache = [];

            if (snapshot.empty) {
                orderListDiv.innerHTML = "<p style='color: var(--text-muted);'>Nenhum registro encontrado no banco de dados.</p>";
                lucroUI.textContent = "R$ 0,00";
                return;
            }

            snapshot.forEach(doc => {
                const p = doc.data();
                const id = doc.id;
                p.id = id;
                window.pedidosCache.push(p);

                const statusNormalizado = (p.status || 'pendente').toLowerCase();

                if (statusNormalizado.includes('pago') || statusNormalizado.includes('aprovado') || statusNormalizado.includes('enviado') || statusNormalizado.includes('entregue')) {
                    totalProfit += (p.totals?.finalTotal || 0);
                }

                const date = p.createdAt?.toDate().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) || "00/00/0000";

                let itemsHtml = p.items?.map(item => `
                    <div class="item-row">
                        <div class="item-left">
                            <img src="${item.img || ''}" alt="${item.name}">
                            <div class="item-info">
                                <h4>${item.name || 'Produto'}</h4>
                                <span>Tamanho: ${item.size || 'Único'}</span>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap: 20px;">
                            <div class="qty-badge">${item.quantity || 1}</div>
                            <div class="item-price">${formatCurrency(item.price || 0)}</div>
                        </div>
                    </div>
                `).join('') || "";

                let badgeClass = 'pendente';
                if (statusNormalizado.includes('pago') || statusNormalizado.includes('aprovado')) badgeClass = 'pago';
                else if (statusNormalizado.includes('enviado')) badgeClass = 'enviado';
                else if (statusNormalizado.includes('entregue')) badgeClass = 'entregue';
                else if (statusNormalizado.includes('rejeitado')) badgeClass = 'rejeitado';

                const card = document.createElement('div');
                card.className = `order-card ${badgeClass === 'rejeitado' ? 'rejeitado' : ''}`;
                card.setAttribute('data-status', p.status || 'pendente');
                card.setAttribute('data-id', id);
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="order-id">📦 PEDIDO: <span>#${id.substring(0,8).toUpperCase()}</span></div>
                        <div class="status-badge ${badgeClass}">${p.status || 'Pendente'}</div>
                    </div>

                    <div class="terminal-grid">
                        <div class="grid-cell">
                            <label>👤 DESTINATÁRIO</label>
                            <div class="main-data">${p.cliente?.nome || 'Nome não informado'}</div>
                            <div class="email-data">${p.cliente?.email || 'Gmail/E-mail N/A'}</div>
                            <div class="sub-data">📱 ${p.cliente?.whatsapp || 'Sem Whats'}</div>
                            <div class="sub-data" style="color:var(--acid-green); font-weight: bold; margin-top:2px;">🪪 CPF: ${p.cliente?.cpf || 'Não informado'}</div>
                        </div>
                        <div class="grid-cell">
                            <label>📅 DATA/HORA</label>
                            <div class="main-data">${date.split(' ')[0]}</div>
                            <div class="sub-data" style="color:var(--text-muted)">${date.split(' ')[1] || ''}</div>
                        </div>
                        
                        <div class="grid-cell">
                            <label>📍 ENDEREÇO DE ENTREGA</label>
                            <div class="main-data">${p.shipping?.logradouro || ''}, ${p.shipping?.numero || 'S/N'}</div>
                            <div class="sub-data" style="color:var(--text-muted)">
                                ${p.shipping?.bairro || ''} - ${p.shipping?.cidadeUF || ''}
                            </div>
                            ${p.shipping?.cep ? `<div class="sub-data">CEP: ${p.shipping.cep}</div>` : ''}
                            ${p.shipping?.complemento ? `<div style="font-size: 0.75rem; color: #a0a0a0; margin-top: 2px;">Comp: ${p.shipping.complemento}</div>` : ''}
                        </div>
                        
                        <div class="grid-cell">
                            <label>💳 TOTAL</label>
                            <div class="total-val">${formatCurrency(p.totals?.finalTotal || 0)}</div>
                            <div class="sub-data" style="color:var(--text-muted)">${p.payment?.method || 'N/A'}</div>
                        </div>
                    </div>

                    <div class="items-panel">
                        <span style="font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; margin-bottom:5px; display:block;">ITENS DO PEDIDO</span>
                        ${itemsHtml}
                    </div>

                    <div class="card-footer">
                        <div>
                            <span class="footer-label" style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">ATUALIZAR STATUS DO PEDIDO</span>
                            <select class="status-select" onchange="updateStatus('${id}', this.value)">
                                <option value="pendente" ${statusNormalizado === 'pendente' ? 'selected' : ''}>⏳ Pendente</option>
                                <option value="Aprovado (Pago)" ${(statusNormalizado.includes('pago') || statusNormalizado.includes('aprovado')) ? 'selected' : ''}>💳 Pago / Aprovado</option>
                                <option value="enviado" ${statusNormalizado === 'enviado' ? 'selected' : ''}>🚚 Enviado</option>
                                <option value="entregue" ${statusNormalizado === 'entregue' ? 'selected' : ''}>✅ Entregue</option>
                                <option value="rejeitado" ${statusNormalizado === 'rejeitado' ? 'selected' : ''}>❌ Rejeitado</option>
                            </select>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <button class="btn-superfrete" onclick="enviarPedidoSuperFrete('${id}')">🚀 Enviar SuperFrete</button>
                            <button class="btn-danger-glass" onclick="rejeitarPedido('${id}')">[X] Rejeitar</button>
                        </div>
                    </div>
                `;

                orderListDiv.appendChild(card);
            });

            lucroUI.textContent = formatCurrency(totalProfit);
            aplicarFiltroPedidos();
        });

        async function updateStatus(id, val) {
            try {
                await db.collection("pedidos").doc(id).update({ 
                    status: val,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error("Erro ao atualizar status:", error);
                alert("Erro ao alterar o status do pedido.");
            }
        }

        async function rejeitarPedido(id) {
            if(confirm("Deseja rejeitar este pedido e removê-lo dos lucros?")) {
                await updateStatus(id, 'rejeitado');
            }
        }

        async function limparTodosPedidos() {
            const confirmacao = prompt("⚠️ PERIGO: Isso apagará TODOS os pedidos do servidor.\nDigite CONFIRMAR em maiúsculas para continuar:");
            if (confirmacao === 'CONFIRMAR') {
                try {
                    const snapshot = await db.collection("pedidos").get();
                    if (snapshot.empty) { alert("Nenhum pedido para limpar."); return; }
                    const batch = db.batch();
                    snapshot.forEach(doc => { batch.delete(doc.ref); });
                    await batch.commit();
                    alert("A purga de dados foi concluída com sucesso.");
                } catch (error) {
                    console.error(error); alert("Erro na comunicação com o banco de dados.");
                }
            } else if (confirmacao !== null) {
                alert("Palavra incorreta. Purga cancelada.");
            }
        }

        // ================= LÓGICA DE PRODUTOS & EDITAR =================
        const formProd = document.getElementById('form-produto');
        const catSelect = document.getElementById('prod-categoria');
        const boxPrecoOriginal = document.getElementById('box-preco-original');
        const boxTamanhosRoupas = document.getElementById('box-tamanhos-roupas');
        const boxTamanhosCalcados = document.getElementById('box-tamanhos-calcados');
        const labelPreco = document.getElementById('label-preco');
        const inputPrecoOriginal = document.getElementById('prod-preco-original');

        function atualizarVisibilidadeCampos() {
            const cat = catSelect.value;

            if (cat === 'promocoes') {
                boxPrecoOriginal.style.display = 'flex';
                inputPrecoOriginal.required = true;
                labelPreco.textContent = 'Preço Promocional (R$)';
            } else {
                boxPrecoOriginal.style.display = 'none';
                inputPrecoOriginal.required = false;
                inputPrecoOriginal.value = '';
                labelPreco.textContent = 'Preço Unitário (R$)';
            }

            if (['tenis', 'chinelos'].includes(cat)) {
                boxTamanhosCalcados.style.display = 'flex';
                boxTamanhosRoupas.style.display = 'none';
            } else if (['camisas', 'camisas-time', 'agasalhos', 'calcas-cargo', 'calcas-alfaiataria', 'moletons', 'calcas', 'conjuntos'].includes(cat)) {
                boxTamanhosRoupas.style.display = 'flex';
                boxTamanhosCalcados.style.display = 'none';
            } else if (cat === 'promocoes') {
                boxTamanhosRoupas.style.display = 'flex';
                boxTamanhosCalcados.style.display = 'flex';
            } else {
                boxTamanhosRoupas.style.display = 'none';
                boxTamanhosCalcados.style.display = 'none';
            }
        }

        catSelect.addEventListener('change', atualizarVisibilidadeCampos);

        function getTamanhosSelecionados() {
            const selecionados = [];
            document.querySelectorAll('.size-checkbox:checked').forEach(cb => {
                const parentBox = cb.closest('.input-box');
                if (parentBox && parentBox.style.display !== 'none') {
                    selecionados.push(cb.value);
                }
            });
            return selecionados;
        }

        formProd.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.textContent = "PROCESSANDO...";

            const precoVal = parseFloat(document.getElementById('prod-preco').value);
            const precoOriginalVal = inputPrecoOriginal.value ? parseFloat(inputPrecoOriginal.value) : null;
            const categoriaVal = catSelect.value;
            const tamanhosVal = getTamanhosSelecionados();

            try {
                const produtoData = {
                    nome: document.getElementById('prod-nome').value,
                    preco: precoVal,
                    img: document.getElementById('prod-img').value,
                    categoria: categoriaVal,
                    tamanhos: tamanhosVal
                };

                if (categoriaVal === 'promocoes' && precoOriginalVal) {
                    produtoData.precoOriginal = precoOriginalVal;
                }

                if (editandoId) {
                    produtoData.atualizadoEm = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection("produtos").doc(editandoId).update(produtoData);
                    alert("Produto atualizado com sucesso!");
                    cancelarEdicao();
                } else {
                    produtoData.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection("produtos").add(produtoData);
                    alert("Produto cadastrado com sucesso!");
                    cancelarEdicao();
                }
            } catch (error) {
                console.error(error);
                alert("Erro ao salvar produto.");
            } finally {
                btnSubmit.textContent = editandoId ? "SALVAR ALTERAÇÕES" : "CADASTRAR PRODUTO";
            }
        });

        db.collection("produtos").orderBy("criadoEm", "desc").onSnapshot(snap => {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            window.produtosCache = {};

            snap.forEach(doc => {
                const p = doc.data();
                window.produtosCache[doc.id] = p;

                let precoHtml = `<div style="color:var(--acid-green); font-size:1rem; margin-bottom:10px;">${formatCurrency(p.preco || 0)}</div>`;
                
                if (p.categoria === 'promocoes' && p.precoOriginal) {
                    precoHtml = `
                        <div style="margin-bottom:10px; display:flex; align-items:baseline; gap:8px;">
                            <span style="text-decoration: line-through; color: var(--text-muted); font-size: 0.8rem;">${formatCurrency(p.precoOriginal)}</span>
                            <span style="color:var(--acid-green); font-size:1rem;">${formatCurrency(p.preco || 0)}</span>
                        </div>
                    `;
                }

                const tamanhosTxt = (p.tamanhos && p.tamanhos.length > 0) 
                    ? p.tamanhos.join(', ') 
                    : 'Sem tamanhos';

                list.innerHTML += `
                    <div style="background:var(--glass-bg); padding:15px; border-radius:12px; border:1px solid var(--glass-border); display:flex; flex-direction:column; justify-content:space-between;">
                        <div>
                            <img src="${p.img}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.05);">
                            <h4 style="font-size:0.85rem; margin-bottom:4px; color:#fff;">${p.nome}</h4>
                            <span style="font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:4px;">Cat: ${p.categoria || 'N/A'}</span>
                            <span style="font-size:0.7rem; color:var(--acid-green); display:block; margin-bottom:10px;">Tam: ${tamanhosTxt}</span>
                            ${precoHtml}
                        </div>
                        <div style="display:flex; flex-direction:column; gap:8px;">
                            <button onclick="editProd('${doc.id}')" class="btn-edit-glass" style="width:100%;">Editar</button>
                            <button onclick="deleteProd('${doc.id}')" class="btn-danger-glass" style="width:100%;">Excluir</button>
                        </div>
                    </div>
                `;
            });
        });

        function editProd(id) {
            const p = window.produtosCache[id];
            if (!p) return;

            editandoId = id;
            document.getElementById('prod-nome').value = p.nome || '';
            document.getElementById('prod-categoria').value = p.categoria || 'camisas';
            document.getElementById('prod-preco').value = p.preco || '';
            document.getElementById('prod-preco-original').value = p.precoOriginal || '';
            document.getElementById('prod-img').value = p.img || '';

            atualizarVisibilidadeCampos();

            document.querySelectorAll('.size-checkbox').forEach(cb => {
                cb.checked = p.tamanhos ? p.tamanhos.includes(cb.value) : false;
            });

            document.getElementById('btn-submit').textContent = "SALVAR ALTERAÇÕES";
            document.getElementById('btn-cancelar').style.display = "block";
            
            document.getElementById('form-produto').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelarEdicao() {
            editandoId = null;
            formProd.reset();
            atualizarVisibilidadeCampos();
            document.querySelectorAll('.size-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('btn-submit').textContent = "CADASTRAR PRODUTO";
            document.getElementById('btn-cancelar').style.display = "none";
        }

        async function deleteProd(id) {
            if(confirm("Remover item do banco de dados?")) {
                await db.collection("produtos").doc(id).delete();
                if (editandoId === id) cancelarEdicao();
            }
        }

        atualizarVisibilidadeCampos();
    </script>
</body>
</html>
